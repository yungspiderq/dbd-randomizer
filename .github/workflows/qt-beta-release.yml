name: Qt beta - verify, build and publish prerelease

on:
  push:
    branches: ["preview/qml-redesign-2026-11-10", "fix/qt-stability-phase1"]
    paths: ["qml_preview/**", ".github/workflows/qt-beta-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qt-beta-release
  cancel-in-progress: true

jobs:
  windows-qt-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qml_preview/requirements.txt pyinstaller
      - name: Verify release and updater version match
        shell: pwsh
        run: |
          $releaseTag = (Select-String -Path ".github/workflows/qt-beta-release.yml" -Pattern '^\s*\$tag = "([^"]+)"').Matches.Groups[1].Value
          $installedTag = python -c "import sys; sys.path.insert(0, 'qml_preview'); import qt_updater; print(qt_updater.CURRENT_TAG)"
          if ($LASTEXITCODE -ne 0 -or $releaseTag -ne $installedTag) { throw "Release tag does not match updater version: $releaseTag / $installedTag" }
          Write-Host "Release and updater version match: $installedTag"
      - name: Python syntax check
        run: python -m py_compile qml_preview/main.py qml_preview/native_backend.py qml_preview/rotation_engine.py qml_preview/stats_engine.py qml_preview/icon_queue.py qml_preview/perk_cards.py qml_preview/favorites.py qml_preview/appearance.py qml_preview/build_icon.py qml_preview/addon_effects.py qml_preview/qt_updater.py dbd_randomizer.py dbd_github.py dbd_icons_store.py
      - name: Targeted core generation checks
        run: |
          python -c "import dbd_randomizer as d; db=d.db_defaults(); a=d.make_killer_build(db,list(db['killers'])); b=d.make_survivor_build(db,list(db['survivors'])); assert len(a['perks'])==4 and len(b['perks'])==4; assert len(a['addons'])==2 and len(b['addons'])==2; print('Core generation OK')"
      - name: Targeted legacy regression tests
        run: python -m unittest smoke_test.TestConfig smoke_test.TestGeneration smoke_test.TestAutomation -q
      - name: Native Qt backend regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest qml_preview/test_appearance.py qml_preview/test_favorites.py qml_preview/test_qt_updater.py qml_preview/test_rotation_engine.py qml_preview/test_icon_queue.py qml_preview/test_stats_engine.py qml_preview/test_perk_cards.py qml_preview/test_native_backend.py -v
      - name: Generate icon files for Windows and QML
        run: |
          python qml_preview/build_icon.py
          python -c "from PIL import Image; from pathlib import Path; p=Path('qml_preview/assets'); assert (p/'app_icon.ico').is_file() and (p/'app_icon.png').is_file(); im=Image.open(p/'app_icon.png'); assert im.size==(256,256); print('Native icon OK')"
      - name: QML smoke launch with the real engine
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python qml_preview/main.py --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qml_preview/main.py --smoke-appearance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qml_preview/main.py --smoke-catalogs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows portable directory
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --contents-directory _internal --windowed --name DBDRandomizerQtBeta --paths . --add-data "qml_preview/Main.qml;qml_preview" --add-data "qml_preview/assets/app_icon.png;qml_preview/assets" --icon "qml_preview/assets/app_icon.ico" --hidden-import pydirectinput --hidden-import pyautogui --hidden-import keyboard --hidden-import PIL --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtQuickLayouts qml_preview/main.py
          $app = Join-Path $PWD "dist/DBDRandomizerQtBeta"
          if (-not (Test-Path "$app/DBDRandomizerQtBeta.exe" -PathType Leaf)) { throw "Missing portable EXE" }
          if (-not (Test-Path "$app/_internal/python312.dll" -PathType Leaf)) { throw "Missing persistent Python 3.12 DLL in _internal" }
          Write-Host "Portable EXE: $([math]::Round((Get-Item "$app/DBDRandomizerQtBeta.exe").Length / 1MB, 2)) MiB"
          Write-Host "Portable runtime: $([math]::Round(((Get-ChildItem "$app/_internal" -Recurse -File | Measure-Object -Property Length -Sum).Sum) / 1MB, 2)) MiB"

      - name: Test unpacked EXE launch
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Join-Path $PWD "dist/DBDRandomizerQtBeta/DBDRandomizerQtBeta.exe"
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          $watch.Stop()
          Write-Host "Portable EXE smoke time: $([math]::Round($watch.Elapsed.TotalSeconds, 2)) seconds"
          if ($p.ExitCode -ne 0) { throw "Portable Qt startup failed with exit $($p.ExitCode)" }

      - name: Create portable ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/DBDRandomizerQtBeta" -DestinationPath "dist/DBDRandomizerQtBeta.zip" -CompressionLevel Optimal -Force
          if (-not (Test-Path "dist/DBDRandomizerQtBeta.zip" -PathType Leaf)) { throw "Missing portable ZIP" }
          python -c "import sys; sys.path.insert(0, 'qml_preview'); import qt_updater as u; from pathlib import Path; import tempfile; import shutil; z=Path('dist/DBDRandomizerQtBeta.zip'); d=Path(tempfile.mkdtemp()); p=u._unpack_verified(z,d); assert (p/'DBDRandomizerQtBeta.exe').is_file() and (p/'_internal'/'python312.dll').is_file(); print('Safe ZIP validation OK'); shutil.rmtree(d)"
          if ($LASTEXITCODE -ne 0) { throw "ZIP did not pass safe extraction and DLL check" }
          $hash = (Get-FileHash "dist/DBDRandomizerQtBeta.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  DBDRandomizerQtBeta.zip" | Set-Content -Path "dist/DBDRandomizerQtBeta.zip.sha256" -Encoding ascii
          Write-Host "Portable ZIP size: $([math]::Round((Get-Item 'dist/DBDRandomizerQtBeta.zip').Length / 1MB, 2)) MiB"

      - name: Upload verified Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBDRandomizerQtBeta16-Portable-Windows
          path: |
            dist/DBDRandomizerQtBeta.zip
            dist/DBDRandomizerQtBeta.zip.sha256

      - name: Publish or update GitHub prerelease
        if: github.ref == 'refs/heads/preview/qml-redesign-2026-11-10'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.28.0-qt-beta.16"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag dist/DBDRandomizerQtBeta.zip dist/DBDRandomizerQtBeta.zip.sha256 --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag dist/DBDRandomizerQtBeta.zip dist/DBDRandomizerQtBeta.zip.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DBD Randomizer Qt Beta 16 — Stability Fixes" --notes-file "qml_preview/RELEASE_NOTES.md" --prerelease
          }
