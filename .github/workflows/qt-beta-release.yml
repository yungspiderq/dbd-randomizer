name: Qt beta - verify, build and publish prerelease

on:
  push:
    branches: ["preview/qml-redesign-2026-11-10"]
    paths: ["qml_preview/**", ".github/workflows/qt-beta-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qt-beta-release
  cancel-in-progress: true

jobs:
  windows-qt-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qml_preview/requirements.txt pyinstaller
      - name: Python syntax check
        run: python -m py_compile qml_preview/main.py qml_preview/native_backend.py qml_preview/rotation_engine.py qml_preview/stats_engine.py qml_preview/icon_queue.py qml_preview/perk_cards.py qml_preview/build_icon.py qml_preview/addon_effects.py qml_preview/qt_updater.py dbd_randomizer.py dbd_github.py dbd_icons_store.py
      - name: Targeted core generation checks
        run: |
          python -c "import dbd_randomizer as d; db=d.db_defaults(); a=d.make_killer_build(db,list(db['killers'])); b=d.make_survivor_build(db,list(db['survivors'])); assert len(a['perks'])==4 and len(b['perks'])==4; assert len(a['addons'])==2 and len(b['addons'])==2; print('Core generation OK')"
      - name: Targeted legacy regression tests
        run: python -m unittest smoke_test.TestConfig smoke_test.TestGeneration smoke_test.TestAutomation -q
      - name: Native Qt backend regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest qml_preview/test_rotation_engine.py qml_preview/test_icon_queue.py qml_preview/test_stats_engine.py qml_preview/test_perk_cards.py qml_preview/test_native_backend.py -v
      - name: Generate icon files for Windows and QML
        run: |
          python qml_preview/build_icon.py
          python -c "from PIL import Image; from pathlib import Path; p=Path('qml_preview/assets'); assert (p/'app_icon.ico').is_file() and (p/'app_icon.png').is_file(); im=Image.open(p/'app_icon.png'); assert im.size==(256,256); print('Native icon OK')"
      - name: QML smoke launch with the real engine
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python qml_preview/main.py --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows portable exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DBDRandomizerQtBeta --paths . --add-data "qml_preview/Main.qml;qml_preview" --add-data "qml_preview/assets/app_icon.png;qml_preview/assets" --icon "qml_preview/assets/app_icon.ico" --hidden-import pydirectinput --hidden-import pyautogui --hidden-import keyboard --hidden-import PIL --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtQuickLayouts qml_preview/main.py
          if (-not (Test-Path dist/DBDRandomizerQtBeta.exe)) { exit 1 }
          $size = (Get-Item dist/DBDRandomizerQtBeta.exe).Length
          Write-Host "Beta 10 EXE size: $([math]::Round($size / 1MB, 2)) MiB; Beta 9 was $([math]::Round(275443744 / 1MB, 2)) MiB"
          if ($size -ge 275443744) { throw "Package did not become smaller than Beta 9" }
      - name: Test packaged EXE launch
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "$PWD/dist/DBDRandomizerQtBeta.exe" -ArgumentList "--smoke" -PassThru -Wait
          $watch.Stop()
          Write-Host "Frozen EXE smoke time: $([math]::Round($watch.Elapsed.TotalSeconds, 2)) seconds"
          if ($p.ExitCode -ne 0) { throw "Frozen QML startup failed with exit $($p.ExitCode)" }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DBDRandomizerQtBeta.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DBDRandomizerQtBeta.exe" | Set-Content -Path dist/DBDRandomizerQtBeta.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBDRandomizerQtBeta-Windows
          path: |
            dist/DBDRandomizerQtBeta.exe
            dist/DBDRandomizerQtBeta.exe.sha256
      - name: Publish or update GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.28.0-qt-beta.10"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag dist/DBDRandomizerQtBeta.exe dist/DBDRandomizerQtBeta.exe.sha256 --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag dist/DBDRandomizerQtBeta.exe dist/DBDRandomizerQtBeta.exe.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DBD Randomizer Qt Beta 10" --notes-file "qml_preview/RELEASE_NOTES.md" --prerelease
          }
