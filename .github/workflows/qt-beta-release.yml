name: Qt beta - verify, build and publish prerelease

on:
  push:
    branches: ["preview/qml-redesign-2026-11-10"]
    paths: ["qml_preview/**", ".github/workflows/qt-beta-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qt-beta-release
  cancel-in-progress: true

jobs:
  windows-qt-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qml_preview/requirements.txt pyinstaller
      - name: Python syntax check
        run: python -m py_compile qml_preview/main.py qml_preview/qt_bridge.py dbd_randomizer.py dbd_github.py dbd_icons_store.py
      - name: Check original generation engine
        run: python dbd_randomizer.py --selftest
      - name: Check original smoke test suite
        run: python smoke_test.py
      - name: QML smoke launch with the real engine
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python qml_preview/main.py --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows portable exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DBDRandomizerQtBeta --paths . --add-data "qml_preview/Main.qml;qml_preview" --hidden-import tkinter --hidden-import pydirectinput --hidden-import pyautogui --hidden-import keyboard --hidden-import PIL --collect-all PySide6 qml_preview/main.py
          if (-not (Test-Path dist/DBDRandomizerQtBeta.exe)) { exit 1 }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBDRandomizerQtBeta-Windows
          path: dist/DBDRandomizerQtBeta.exe
      - name: Publish or update GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.28.0-qt-beta.1"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag dist/DBDRandomizerQtBeta.exe --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag dist/DBDRandomizerQtBeta.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DBD Randomizer Qt Beta 1" --notes-file "qml_preview/RELEASE_NOTES.md" --prerelease
          }
