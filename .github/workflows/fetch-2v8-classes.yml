name: fetch-2v8-classes

# Классы режима «2 против 8» живут на русской вики
# (dead-by-daylight.fandom.com/ru, категория «2 против 8», статьи «<Класс> (класс)»).
# Fandom закрывает Cloudflare доступ для дата-центров, поэтому из песочницы/CI
# статьи не снимаются (403) — этот workflow делает то же самое с раннера и
# прикладывает результат АРТЕФАКТОМ (ничего не коммитит, права на запись не нужны).
#
# Дальше на своей машине:
#   1. скачать артефакт ru-2v8-classes и распаковать в корень репозитория
#      (tools/wiki_cache/ru_classes/*.wiki и _pages.json, _icons.json);
#   2. python tools/resolve_classes.py   — пересоберёт блок CLASSES_2V8 в dbd_data.py
#      и сравнит его с тем, что в репозитории (отчёт о расхождениях в логе);
#   3. python smoke_test.py && релиз.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-2v8-classes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Скачать статьи классов и пересобрать CLASSES_2V8
        run: |
          python tools/resolve_classes.py --force
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import dbd_data as D
          data = getattr(D, "CLASSES_2V8", {}) or {}
          total = sum(len(v) for v in data.values())
          print(f"классов: {total} "
                f"(выживших {len(data.get('SURVIVOR', []))}, убийц {len(data.get('KILLER', []))})")
          for side in ("SURVIVOR", "KILLER"):
              for c in data.get(side, []):
                  icon = "иконка" if c.get("url") else "БЕЗ иконки"
                  print(f"  {side:<9} {c['ru']:<18} {c['en']:<12} навыков {len(c['skills'])} ({icon})")
          if total < 9:
              raise SystemExit(f"ожидалось 9 классов, получено {total}")
          PY

      - name: Отчёт о расхождении с репозиторием
        run: |
          if git diff --quiet dbd_data.py; then
            echo "CLASSES_2V8 идентичен тому, что в репозитории — обновлять нечего."
          else
            echo "Есть отличия от committed-версии (патч ниже, артефакт diff):"
            git --no-pager diff --stat dbd_data.py
            git --no-pager diff dbd_data.py | head -200
            git diff dbd_data.py > classes_2v8.diff || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ru-2v8-classes
          path: |
            tools/wiki_cache/ru_classes/
            dbd_data.py
            classes_2v8.diff
          if-no-files-found: error
